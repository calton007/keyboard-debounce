[package]
name = "keyboard-debounce"
version = "0.3.0"
description = "Windows keyboard debounce tray application"
edition = "2024"
rust-version = "1.90"
default-run = "keyboard-debounce"

[lib]
name = "keyboard_debounce"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ts-rs = { version = "11", features = ["serde-compat"] }
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Memory"
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
